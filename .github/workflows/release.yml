name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, script: dist:mac }
          - { os: windows-latest, script: dist:win }
          - { os: ubuntu-latest, script: dist:linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: desktop
      - run: npm run ${{ matrix.script }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # unsigned builds
      - uses: actions/upload-artifact@v4
        with:
          name: agent-usage-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  native-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./mac/build_app.sh
      - run: ditto -c -k --keepParent mac/AgentUsageBar.app AgentUsageBar-mac-native.zip
      - uses: actions/upload-artifact@v4
        with: { name: agent-usage-mac-native, path: AgentUsageBar-mac-native.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, native-mac]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: artifacts/*, generate_release_notes: true }
